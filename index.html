<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>樂團旅遊對帳系統 v2.3.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-inner">
          <i class="fa-solid fa-shield-halved text-xl"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold leading-tight">樂團旅遊帳務與查詢系統</h1>
            <span class="bg-indigo-900/60 text-indigo-200 text-[10px] px-2 py-0.5 rounded border border-indigo-500/30">v2.3.0 🔒 加密修復版</span>
          </div>
          <p class="text-indigo-200 text-xs">家長對帳 · 多期訂金支援 · UTF8 加密防護</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <!-- 行程選擇器 -->
        <div class="relative">
          <select id="tripSelector" onchange="switchTrip()" class="bg-indigo-800 text-white text-sm px-3 py-2 pr-8 rounded-lg border border-indigo-500 focus:outline-none focus:ring-2 focus:ring-white">
            <option value="hualien2027" selected>2027 寒假花蓮旅行</option>
            <option value="vienna2027">2027 暑假維也納音樂節 (海外多期)</option>
          </select>
        </div>

        <button id="adminBtn" onclick="openAdminLoginModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-3 py-2 rounded-lg transition flex items-center gap-1.5">
          <i class="fa-solid fa-user-gear"></i> 幹部後台
        </button>

        <button id="logoutBtn" onclick="logout()" class="hidden bg-rose-600 hover:bg-rose-700 text-white text-sm px-3 py-2 rounded-lg transition">
          <i class="fa-solid fa-right-from-bracket"></i> 登出
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 mb-auto w-full">

    <!-- 登入區塊 -->
    <div id="loginSection" class="max-w-md mx-auto bg-white rounded-2xl shadow-md p-6 border border-slate-100">
      <div class="text-center mb-6">
        <span id="currentTripBadge" class="bg-indigo-100 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full">
          當前行程：2027 寒假花蓮旅行
        </span>
        
        <!-- 對帳資料更新時間警告提示 -->
        <div class="mt-4 bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-3 text-xs text-left flex items-start gap-2.5 shadow-sm">
          <i class="fa-solid fa-triangle-exclamation text-amber-600 text-base mt-0.5 shrink-0"></i>
          <div>
            <p class="font-bold">對帳資料更新時間提醒</p>
            <p class="mt-0.5 text-amber-700">目前對帳資料最後更新時間為：<span id="lastUpdatedTime" class="font-bold text-amber-900">2026/10/12 20:00</span>。若您在此時間之後匯款，請耐心等待幹部於下次對帳時更新。</p>
          </div>
        </div>

        <h2 class="text-xl font-bold text-slate-800 mt-5">團員身分驗證</h2>
        <p class="text-slate-500 text-sm mt-1">請輸入學生姓名與生日進行登入</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">學生姓名</label>
          <input type="text" id="studentName" placeholder="例如：陳佑宇" required
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">學生生日 (西元年月日)</label>
          <input type="text" id="studentBirthday" placeholder="例如：20130928 或 2013/9/28" required
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
        </div>

        <div id="loginError" class="hidden text-rose-500 text-sm text-center bg-rose-50 p-3 rounded-lg border border-rose-200 space-y-1">
          <p><i class="fa-solid fa-triangle-exclamation mr-1"></i> 姓名或生日不正確，或未選擇對應之行程。</p>
          <button type="button" onclick="clearSystemCache()" class="text-xs text-indigo-600 underline hover:text-indigo-800 font-medium pt-1">
            <i class="fa-solid fa-arrows-rotate mr-1"></i>如果確定輸入無誤，請點此「重置系統快取」
          </button>
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg shadow-md transition duration-200">
          核對並登入
        </button>
      </form>
    </div>

    <!-- 家長查詢結果 Dashboard -->
    <div id="dashboardSection" class="hidden space-y-6">
      <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-6 flex flex-wrap items-center justify-between gap-4">
        <div>
          <span id="userTripTag" class="text-indigo-600 text-xs font-semibold uppercase tracking-wider bg-indigo-100 px-2.5 py-1 rounded-full">--</span>
          <h2 class="text-2xl font-bold text-slate-800 mt-2"><span id="displayName">--</span> 同學家長 您好！</h2>
          <p class="text-slate-600 text-sm mt-1">分房需求：<span id="displayRoom" class="font-medium text-slate-800">--</span></p>
        </div>
      </div>

      <!-- 金額概覽總卡片 -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-slate-500 text-sm">行程應繳總費用</p>
          <p class="text-
